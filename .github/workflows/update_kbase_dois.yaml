name: Update KBase DOI List

on:
    schedule:
        # Runs weekly on Mondays at 08:00 UTC
        - cron: "0 8 * * 1"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update-kbase-dois:
        runs-on: ubuntu-latest
        name: Generate and update KBase DOI list
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: main

            - name: Setup python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
              with:
                  python-version: "3.14"

            - name: Install uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
              with:
                  python-version: 3.14

            - name: Install project
              run: uv sync --frozen --no-sync

            - name: Generate KBase DOI list
              run: uv run --frozen --no-sync scripts/gen_kbase_doi_list.py

            - name: Create Pull Request with updated KBase DOI list
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
              with:
                  token: ${{ secrets.GHCR_TOKEN || github.token }}
                  add-paths: |
                      src/docs/pages/kbase_dois.md
                  base: main
                  branch: update-kbase-dois
                  delete-branch: true
                  commit-message: "Update KBase FAIR Narratives DOI list"
                  title: "Update KBase FAIR Narratives DOI list"
                  body: |
                      Automated weekly update of `src/docs/pages/kbase_dois.md` generated by `scripts/gen_kbase_doi_list.py`.
