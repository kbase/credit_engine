name: Lint and Test

on:
    workflow_call:

jobs:
    run_unit_tests:
        runs-on: ubuntu-latest
        if: 1 == 0
        strategy:
            fail-fast: false

        steps:
            - name: Repo checkout
              uses: actions/checkout@main

            - name: Set up Python 3.
              uses: actions/setup-python@main
              with:
                python-version: 3.12

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install dependencies
              id: install_deps
              run: uv sync

            - name: run pytest -rP tests/
              id: run_pytest
              run: |
                  uv run pytest --cov=credit_engine --cov-report=xml -rP tests/
              continue-on-error: true

            - name: Send to Codecov
              id: send_to_codecov
              uses: codecov/codecov-action@main
              continue-on-error: true
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: outcome failure
              if: steps.run_pytest.outcome != 'success' || steps.send_to_codecov.outcome != 'success'
              run: |
                  echo "Python tests: ${{ steps.run_pytest.outcome }}"
                  echo "upload coverage: ${{ steps.send_to_codecov.outcome }}"
                  exit 1

            - name: outcome success
              run: |
                  echo "Python tests: ${{ steps.run_pytest.outcome }}"
                  echo "upload coverage: ${{ steps.send_to_codecov.outcome }}"
                  exit 0

    run_linkml_tasks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false

        steps:
            - name: Repo checkout
              uses: actions/checkout@main

            - name: Set up Python 3.
              uses: actions/setup-python@main
              with:
                python-version: 3.12

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install dependencies
              id: install_deps
              run: uv sync

            - name: Lint linkml file
              id: lint_linkml
              run: |
                  uv run linkml-lint ./schema/dcm/linkml/credit_metadata.yaml --ignore-warnings
              continue-on-error: true

            - name: Validate sample data against the schema
              id: validate_sample_data
              run: |
                  uv run linkml-validate -s schema/dcm/linkml/credit_metadata.yaml sample_data/dcm/**/*kbcms.json
              continue-on-error: true

            - name: Validate sample data against JSONschema
              id: validate_sample_data_against_jsonschema
              run: |
                  uv run check-jsonschema --schemafile schema/dcm/jsonschema/credit_metadata.schema.json --verbose sample_data/dcm/**/*dcm.json
              continue-on-error: true

            - name: outcome failure
              if: steps.lint_linkml.outcome != 'success' # || steps.validate_sample_data.outcome != 'success'
              run: |
                  echo "linkml linting: ${{ steps.lint_linkml.outcome }}"
                  echo "sample data validation: ${{ steps.validate_sample_data.outcome }}"
                  exit 1

            - name: outcome success
              if: steps.lint_linkml.outcome == 'success' # || steps.validate_sample_data.outcome != 'success'
              run: |
                  echo "linkml linting: ${{ steps.lint_linkml.outcome }}"
                  echo "sample data validation: ${{ steps.validate_dcm_data.outcome }}"
                  exit 0
