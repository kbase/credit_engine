name: Lint and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run_linkml_tasks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Repo checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: 3.14

      - name: Install project
        run: uv sync --frozen --no-sync --group docs

      - name: Lint linkml file
        id: lint_linkml
        run: |
          make lint-no-warn
        continue-on-error: true

      - name: Validate sample data against the schema
        id: test_sample_data
        run: |
          make test-sample-data
        continue-on-error: true

      - name: Validate sample data against JSONschema
        id: test_sample_data_jsonschema
        run: |
          make test-sample-data-jsonschema
        continue-on-error: true

      - name: Test documentation generation
        id: test_docgen
        run: |
          make gendoc
        continue-on-error: true

      - name: outcome failure
        if: steps.lint_linkml.outcome != 'success' || steps.test_sample_data.outcome != 'success' || steps.test_sample_data_jsonschema.outcome != 'success' || steps.test_docgen.outcome != 'success'
        run: |
          echo "linkml linting: ${{ steps.lint_linkml.outcome }}"
          echo "sample data validation: ${{ steps.test_sample_data.outcome }}"
          echo "sample data JSON Schema validation: ${{ steps.test_sample_data_jsonschema.outcome }}"
          echo "documentation generator: ${{ steps.test_docgen.outcome }}"
          exit 1

      - name: outcome success
        if: steps.lint_linkml.outcome == 'success' && steps.test_sample_data.outcome == 'success' && steps.test_sample_data_jsonschema.outcome == 'success' && steps.test_docgen.outcome == 'success'
        run: |
          echo All tests passed successfully!
          exit 0
