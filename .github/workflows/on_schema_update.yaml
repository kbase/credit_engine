name: Update JSONSchema and Golang schema bindings

on:
    pull_request:
        branches:
            - develop

jobs:
    changed_files:
        runs-on: ubuntu-latest
        name: Determine schema changes
        steps:
            - uses: actions/checkout@main

            - name: Evaluate LinkML DCM changes
              id: linkml-schema-changes
              uses: tj-actions/changed-files@v44
              with:
                  files: |
                      schema/dcm/linkml/credit_metadata.yaml

            - name: Set up python
              if: steps.linkml-schema-changes.outputs.any_changed == 'true'
              uses: actions/setup-python@main
              with:
                  python-version: 3.12

            - name: Install linkml
              shell: bash -l {0}
              run: |
                  pip3 install linkml

            - name: Check out DTS repo
              if: steps.linkml-schema-changes.outputs.any_changed == 'true'
              uses: actions/checkout@main
              with:
                  repository: kbase/dts
                  path: dts

            - name: Regenerate DTS Golang bindings for credit metadata schema
              if: steps.linkml-schema-changes.outputs.any_changed == 'true'
              shell: bash -l {0}
              run: |
                  gen-golang schema/dcm/linkml/credit_metadata.yaml > dts/credit/metadata.go

            - name: Create DTS pull request with regenerated credit metadata bindings
              if: steps.linkml-schema-changes.outputs.any_changed == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  branch: credit-metadata-schema-update
                  path: dts
                  title: Update to Credit Engine metadata schema
                  token: ${{ secrets.GHCR_TOKEN }}
