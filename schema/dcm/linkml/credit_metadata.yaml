# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://kbase.github.io/credit_engine/linkml/credit_metadata
name: credit_metadata
description: |
  The Dataset Citation Metadata (DCM) schema is designed to capture accurate credit (citation) information for scientific datasets whilst maintaining compatibility with DOI minting authorities such as [DataCite](https://datacite.org), [Crossref](https://www.crossref.org), and the US Department of Energy's [Office of Scientific and Technical Information](https://www.osti.gov).

  The schema is based heavily on the [DataCite Metadata Schema](https://schema.datacite.org) and [Commonmeta](https://docs.commonmeta.org), with some alterations and additions to allow more accurate capture of dataset-relevant information.

  Schema documentation is available at https://kbase.github.io/credit_engine/.
version: 0.0.8
prefixes:
  biolink: https://w3id.org/biolink/vocab/
  commonmeta: https://commonmeta.org/
  dcm: https://kbase.github.io/credit_engine/linkml/
  Crossref: https://crossref.org/
  DataCite: http://purl.org/spar/datacite/
  DOI: http://identifiers.org/doi/
  JGI: https://data.jgi.doe.gov/search/
  linkml: https://w3id.org/linkml/
  nmdc: https://w3id.org/nmdc/
  ORCID: http://identifiers.org/orcid/
  OSTI.ARTICLE: https://www.osti.gov/biblio/
  schema: http://schema.org/

imports:
  - components
  - linkml:types
default_range: string
default_curi_maps:
  - semweb_context
default_prefix: dcm

classes:
  CreditMetadata:
    tree_root: true
    description: |
      Represents the credit metadata associated with an object.

      In the following documentation, 'resource' is used to refer to the object
      that the CM pertains to, for example, a KBase Workspace object; a
      sample from NMDC or ESS-DIVE; sequence data from IMG.

      The 'resource_type' field takes values from the ResourceType enum, which combines
      the [DataCite resourceTypeGeneral](https://datacite-metadata-schema.readthedocs.io/en/4.7/appendices/appendix-1/resourceTypeGeneral/)
      vocabulary with the resource types used by Commonmeta, Crossref, and OSTI. A free
      text description of the resource type can be supplied in 'resource_type_detail'.

      One or more licenses may be supplied. Each license may be given as an URL pointing to licensing information for
      the resource, or using an SPDX license identifier from the list maintained at [https://spdx.org/licenses](https://spdx.org/licenses).

      Required fields are:
      - identifier
      - resource_type
      - versioning information: if the resource does not have an explicit version number,
      one or more dates should be supplied: ideally the date of resource publication and
      the last update (if applicable).
      - contributors (one or more required)
      - titles (one or more required)
      - meta

      The resource_type field is required; if no value is supplied, it is populated
      with 'dataset'.

    attributes:
      comment:
        slot_uri: schema:comment
        description: List of strings of freeform text providing extra information about this credit metadata.
        multivalued: true
        examples:
          - value: "This comment adds a lot of extra value!"

      content_url:
        description: The URL of the content of the resource.
        multivalued: true
        range: uri

      contributors:
        slot_uri: schema:creator
        description: A list of people and/or organizations who contributed to the resource.
        required: true
        multivalued: true
        range: Contributor
        narrow_mappings:
          - DataCite:attributes.contributors
          - DataCite:attributes.creators
          - ORCID:contributors
          - OSTI.ARTICLE:contributors
          - OSTI.ARTICLE:authors
          - JGI:organisms.pi

      dates:
        description: A list of relevant lifecycle events for the resource. Note that these dates apply only to the resource itself, and not to the creation or update of the credit metadata record for the resource.
        multivalued: true
        range: EventDate
        inlined_as_list: true
        close_mappings:
          - DataCite:attributes.published
            # from DataCite:attributes.published
            # via { date: src.attributes.published, event: 'available' }
          - DataCite:attributes.updated
            # from DataCite:attributes.updated
            # via { date: src.attributes.updated, event: 'updated' }
          - DataCite:attributes.dates
            # from DataCite:attributes.dates[]
            # via { date: src.attributes.dates[].date, event: src.attributes.dates[].dateType }
          - ORCID:publicationDate
            # from: ORCID:publicationDate
            # via { date: src.publicationDate, event: 'available' }
          - OSTI.ARTICLE:publication_date
            # from: OSTI.ARTICLE:publication_date
            # via { date: src.publication_date, event: 'available' }
          - Crossref:message.deposited
            # from: Crossref:message.deposited
            # via { date: src.message.deposited.date-time, event: 'available' }
          - commonmeta:date
            # from: commonmeta:date.<key>
            # via { date: src.date.<key>, event: <key> } ('published' => 'issued')
          - Crossref:database_date
            # creation_date => 'created'; publication_date => 'issued'; update_date => 'updated'
          - OSTI.ARTICLE:media_embargo_sunset_date
            # via { date: src.media_embargo_sunset_date, event: 'available' }

      descriptions:
        slot_uri: schema:description
        description: A brief description or abstract for the resource being represented.
        multivalued: true
        range: Description
        inlined_as_list: true
        exact_mappings:
          - DataCite:attributes.descriptions
          - commonmeta:descriptions
        close_mappings:
          - Crossref:abstract
          - Crossref:statement_info
          - OSTI.ARTICLE:description

      funding:
        slot_uri: schema:funding
        description: Funding sources for the resource.
        multivalued: true
        range: FundingReference
        inlined_as_list: true
        todos:
          - Should funding info be duplicated in the related_identifiers field?
        close_mappings:
          - DataCite:attributes.funding_references
          - Crossref:Message.project.funding
          - OSTI.ARTICLE:awards

      identifier:
        identifier: true
        slot_uri: schema:identifier
        comments:
          - can generate schema:url from the identifier
        description: Resolvable persistent unique identifier for the resource. Should be in the format <database name>:<identifier within database>.
        range: uriorcurie
        required: true
        pattern: "^[a-zA-Z0-9.-_]+:\\S"
        examples:
          - value: RefSeq:GCF_004214875.1
          - value: GenBank:CP035949.1
          - value: img.taxon:648028003
        exact_mappings:
          - DataCite:id
            # from: DataCite:id
            # via: f"DOI:{src.id}"
          - JGI:organisms.grouped_by
            # from src.organisms[].grouped_by
            # via: src.organisms[].files[][src.organisms[].grouped_by]
        narrow_mappings:
          - OSTI.ARTICLE:osti_id
            # from: OSTI.ARTICLE:osti_id
            # via: f"OSTI.ARTICLE:{src.osti_id}"
          - OSTI.ARTICLE:doi
          - ORCID:doi
          # it should be possible to generate an URL from a curie
          - ORCID:url

      language:
        slot_uri: schema:inLanguage
        description: The primary language of the resource, using the appropriate IETF BCP-47 notation.
        examples:
          - value: ru-Cyrl
          - value: en
          - value: fr
        exact_mappings:
          - DataCite:attributes.language
          - commonmeta:language
          - Crossref:message.language
        close_mappings:
          - OSTI.ARTICLE:languages

      license:
        slot_uri: schema:license
        # also slot_uri:isAccessibleForFree
        range: License
        multivalued: true
        inlined_as_list: true
        description: |
          Usage licenses or rights statements for the resource. For each license, use one of the SPDX license identifiers or provide a link to the license text if no SPDX ID is available.

          Supply more than one license if different licenses apply to different versions or uses of the resource (see 'applies_to'), or if the resource is available under a choice of licenses.
        exact_mappings:
          - biolink:license
          - commonmeta:license
        related_mappings:
          - DataCite:attributes.rights_list
          - Crossref:message.license
          - OSTI.ARTICLE:access_limitations

      meta:
        description: Metadata for this credit information, including submitter, schema version, and timestamp.
        range: Metadata

      publisher:
        description: The publisher of the resource. For a dataset, this is the repository where it is stored.
        slot_uri: schema:provider
        range: Organization
        narrow_mappings:
          - ORCID:url
          - OSTI.ARTICLE:site_url

      related_identifiers:
        description: Other resolvable persistent unique IDs related to the resource.
        multivalued: true
        range: PermanentID
        inlined_as_list: true
        # inlined: true
        close_mappings:
          - DataCite:attributes.identifiers
          - DataCite:attributes.related_identifiers
          - DataCite:attributes.alternate_identifiers
          - ORCID:externalIds
          - OSTI.ARTICLE:related_identifiers
        narrow_mappings:
          - ORCID:doi
          # from ORCID:doi
          # via: { id: f"DOI:{src.doi}" }
          - OSTI.ARTICLE:doi
          # from: OSTI.ARTICLE:doi
          # via: { id: f"DOI:{src.doi}"}

      resource_type:
        slot_uri: schema:@type
        description: The broad type of the resource. Defaults to 'dataset'.
        range: ResourceType
        required: true
        ifabsent: ResourceType(dataset)
        exact_mappings:
          - DataCite:attributes.types.resource_type_general
          - commonmeta:type
          # OSTI.ARTICLE:DA is used for dataset
          - OSTI.ARTICLE:product_type
          # ORCID:data-set
          - OSTI.ARTICLE:workType
          # see DataCite:attributes.types
          - DataCite:attributes.types.schema_org
        close_mappings:
          - Crossref:message.type
        narrow_mappings:
          - OSTI.ARTICLE:dataset_type
        examples:
          - value: dataset
          - value: software
          - value: workflow

      titles:
        description: One or more titles for the resource.
        required: true
        multivalued: true
        range: Title
        inlined_as_list: true
        exact_mappings:
          - DataCite:attributes.titles
          - ORCID:title
            # from: ORCID:title
            # via: [{ title: src.title }]
          - OSTI.ARTICLE:title
            # from: OSTI.ARTICLE:title
            # via: [{ title: src.title }]

      url:
        description: The URL of the resource.
        range: uri

      version:
        slot_uri: schema:version
        description: The version of the resource. This must be an absolute version, not a relative version like 'latest'.
        exact_mappings:
          - DataCite:attributes.version
        examples:
          - value: "5"
          - value: 1.2.1
          - value: "20220405"

    any_of:
      - slot_conditions:
          dates:
            required: true
      - slot_conditions:
          version:
            required: true
