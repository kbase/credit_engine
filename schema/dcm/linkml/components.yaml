# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://kbase.github.io/credit_engine/linkml/components
name: components
description: Components for the Dataset Credit Metadata Schema.
prefixes:
  bioportal: https://bioportal.bioontology.org/ontologies/
  commonmeta: https://commonmeta.org/
  dcm: https://kbase.github.io/credit_engine/linkml/
  crcr: https://credit.niso.org/contributor-roles/
  Crossref: https://crossref.org/
  DataCite: http://purl.org/spar/datacite/
  DOI: http://identifiers.org/doi/
  JGI: https://data.jgi.doe.gov/search/
  linkml: https://w3id.org/linkml/
  nmdc: https://w3id.org/nmdc/
  ORCID: http://identifiers.org/orcid/
  OSTI.ARTICLE: https://www.osti.gov/biblio/
  ROR: http://identifiers.org/ror/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
imports:
  - linkml:types
default_range: string
default_curi_maps:
  - semweb_context
default_prefix: dcm

classes:
  Contributor:
    description: |
      Represents a contributor to the resource.

      Contributors must have a 'contributor_type', either 'Person' or 'Organization', and
      one of the 'name' fields: either 'given_name' and 'family_name' (for a person), or 'name' (for an organization or a person).

      The 'contributor_role' field takes values from the DataCite and CRediT contributor
      roles vocabularies. For more information on these resources and choosing
      appropriate roles, please see the following links:

      DataCite contributor roles: [https://support.datacite.org/docs/datacite-metadata-schema-v44-recommended-and-optional-properties#7a-contributortype](https://support.datacite.org/docs/datacite-metadata-schema-v44-recommended-and-optional-properties#7a-contributortype)

      CRediT contributor role taxonomy: [https://credit.niso.org](https://credit.niso.org).
    attributes:
      contributor_type:
        slot_uri: schema:@type
        description: Must be either 'Person' or 'Organization'.
        range: ContributorType
        examples:
          - value: Person
          - value: Organization
        exact_mappings:
          - DataCite:attributes.contributors.name_type
          - DataCite:attributes.creators.name_type
      contributor_id:
        slot_uri: schema:identifier
        description: Persistent unique identifier for the contributor; this might be an ORCID for an individual, or a ROR ID for an organization.
        range: uriorcurie
        pattern: "^[a-zA-Z0-9.-_]+:\\S"
        examples:
          - value: ORCID:0000-0001-9557-7715
          - value: ROR:01znn6x10
        exact_mappings:
          - DataCite:attributes.contributors.name_identifiers.name_identifier
          - DataCite:attributes.creators.name_identifiers.name_identifier
          # from: DataCite:attributes.contributors[*].name_identifiers[*].name_identifier_scheme == 'ORCID'
          # via: f"ORCID:{attributes.contributors[*].name_identifiers[*].name_identifier.replace('https://orcid.org/', '')}"
        narrow_mappings:
          - ORCID:contributor.orcidId
          - OSTI.ARTICLE:author.orcid_id
          - OSTI.ARTICLE:contributor.orcid_id
          - Crossref:message.project.funding.funder.name
      name:
        slot_uri: schema:name
        description: Contributor name. For organizations, this should be the full (unabbreviated) name; can also be used for a person if the given name/family name format is not applicable.
        examples:
          - value: National Institute of Mental Health
          - value: Madonna
          - value: Ransome the Clown
        related_mappings:
          # these have the names comma-separated and inverted
          - DataCite:attributes.creators.name
          - DataCite:attributes.contributors.name
        exact_mappings:
          - JGI:organisms.pi.name
          - ORCID:name
        close_mappings:
          - OSTI.ARTICLE:author
          # from OSTI.ARTICLE:author
          # via: f"{src.author.first_name} {src.author.last_name}"
          - OSTI.ARTICLE:contributor
          # from OSTI.ARTICLE:contributor
          # via: f"{src.contributor.first_name} {src.contributor.last_name}"
      given_name:
        description: The given name(s) of the contributor.
        examples:
          - value: Marionetta Cecille de la
          - value: Helena
          - value: Hubert George
        related_mappings:
          - DataCite:attributes.contributors.givenName
          - DataCite:attributes.creators.givenName
      family_name:
        description: The family name(s) of the contributor.
        examples:
          - value: Carte-Postale
          - value: Bonham Carter
          - value: Wells
        related_mappings:
          - DataCite:attributes.contributors.familyName
          - DataCite:attributes.creators.familyName
      affiliations:
        slot_uri: schema:affiliation
        description: List of organizations with which the contributor is affiliated. For contributors that represent an organization, this may be a parent organization (e.g. KBase, US DOE; Arkin lab, LBNL).
        multivalued: true
        range: Organization
        related_mappings:
          - DataCite:attributes.contributors.affiliation
          # from: DataCite:attributes.contributors[*].affiliation[*]
          # via: {
          #   organization_name: attributes.contributors[*].affiliation[*].name
          # }
          - DataCite:attributes.creators.affiliation
          # from: DataCite:attributes.creators[*].affiliation[*]
          # via: {
          #   organization_name: attributes.creators[*].affiliation[*].name
          # }
          - JGI:organisms.pi.institution
          # from: JGI:organisms[*].pi.institution
          # via: {
          #   organization_name: src.organisms[*].pi.institution
          #}
        narrow_mappings:
          - OSTI.ARTICLE:contributor.affiliation_name
          # via { organization_name: src.contributor.affiliation_name }
      contributor_roles:
        slot_uri: schema:Role
        description: List of roles played by the contributor when working on the resource.
        multivalued: true
        range: ContributorRole
        exact_mappings:
          - DataCite:attributes.contributors.contributor_type
          - DataCite:attributes.creators.contributor_type
        related_mappings:
          - JGI:organisms.pi
          # from: JGI:organisms[*].pi
          # via: "DataCite:ProjectLeader"
        close_mappings:
          # TODO: mappings to CRediT/DataCite roles
          - ORCID:contributor.role
          - OSTI.ARTICLE:contributor.contributorType
    any_of:
      - slot_conditions:
          given_name:
            required: true
          family_name:
            required: true
      - slot_conditions:
          name:
            required: true

  DataSource:
    description: Source of any kind of data.
    attributes:
      access_timestamp:
        description: Unix timestamp for when the data was retrieved from that source.
        comments:
          - This could be added programmatically when updates occur.
        range: integer
        required: true
      source_data_updated:
        description: The date when the data source was last updated, if available.
        range: datetime
      source_name:
        description: Where the data was retrieved from.
        range: string
        examples:
          - value: "DataCite"
          - value: "Crossref"
          - value: "IMG"
      source_url:
        description: URL from whence data was retrieved.
        range: uriorcurie
        examples:
          - value: "https://figshare.com/articles/dataset/Blue_Hole_Metagenome-assembled_Genomes/12644081"
          - value: "https://api.microbiomedata.org/studies/sty-123abc-999"
    any_of:
      - slot_conditions:
          source_name:
            required: true

      - slot_conditions:
          source_url:
            required: true

  Description:
    description: Textual information about the resource being represented.
    attributes:
      description_text:
        description: The text content of the informational element.
        required: true
        examples:
          - value: This is the most interesting dataset ever to earn a DOI.
      description_type:
        description: The type of text being represented.
        range: DescriptionType
        examples:
          - value: abstract
          - value: description
          - value: summary

  EventDate:
    description: |
      Represents an event in the lifecycle of a resource and the date it occurred on.

      See [DataCite documentation on date events](https://support.datacite.org/docs/datacite-metadata-schema-v44-recommended-and-optional-properties#8-date) for more information on the events.
    attributes:
      date:
        description: |
          The date associated with the event. The date may be in the format YYYY, YYYY-MM, YYYY-MM-DD, or an ISO 8601 date-time (YYYY-MM-DDThh:mm:ssTZD).

          A date range may be given using the [RKMS-ISO8601](https://www.ukoln.ac.uk/metadata/dcmi/collection-RKMS-ISO8601/) notation, e.g. 2020-01-01/2020-06-30. The start of the range may be 'unknown'; the end may be 'unknown' or 'open'. Date ranges are useful for 'collected', 'coverage', and 'valid' events.
        pattern: "^(\\d{4}(-\\d{2}){0,2}(T\\d{2}:\\d{2}(:\\d{2}(\\.\\d+)?)?(Z|[+-]\\d{2}:?\\d{2})?)?|unknown)(/(\\d{4}(-\\d{2}){0,2}(T\\d{2}:\\d{2}(:\\d{2}(\\.\\d+)?)?(Z|[+-]\\d{2}:?\\d{2})?)?|unknown|open))?$"
        required: true
        examples:
          - value: "2001"
          - value: "2021-05"
          - value: "1998-02-15"
          - value: "2022-05-03T14:21:07Z"
          - value: "2019-04-01/2019-09-30"
      event:
        description: The nature of the resource-related event that occurred on that date.
        range: EventType
        required: true
        examples:
          - value: available
          - value: updated
      event_information:
        description: Free text information about the event or date.
        examples:
          - value: Embargo period ended.
          - value: Samples collected during the 2019 field season.
        exact_mappings:
          - DataCite:attributes.dates.date_information

  FundingReference:
    class_uri: schema:MonetaryGrant
    description: |
      Represents a funding source for a resource, including the funding body and the grant awarded.

      One (or more) of the fields 'grant_id', 'grant_url', or 'funder.organization_name' is required; others are optional.

      Recommended resources for organization identifiers include:
        - [Research Organization Registry](http://ror.org)
        - [International Standard Name Identifier](https://isni.org)
        - [Crossref Funder Registry](https://www.crossref.org/services/funder-registry/) (to be subsumed into ROR)

      Some organizations may have a digital object identifier (DOI).
    attributes:
      funder:
        slot_uri: schema:funder
        description: The funder for the grant or award.
        range: Organization
      grant_id:
        slot_uri: schema:identifier
        description: Code for the grant, assigned by the funder.
        exact_mappings:
          - DataCite:attributes.funding_references.award_number
          - Crossref:message.award
        narrow_mappings:
          - OSTI.ARTICLE:award_doi
          - OSTI.ARTICLE:award_number
        examples:
          - value: "1296"
          - value: CBET-0756451
          - value: DOI:10.46936/10.25585/60000745
      grant_title:
        slot_uri: schema:name
        description: Title for the grant.
        exact_mappings:
          - DataCite:attributes.funding_references.award_title
        examples:
          - value: Metagenomic analysis of the rhizosphere of three biofuel crops at the KBS intensive site
      grant_url:
        slot_uri: schema:url
        description: URL for the grant.
        exact_mappings:
          - DataCite:attributes.funding_references.award_url
        close_mappings:
          - OSTI.ARTICLE:award_doi
        range: uriorcurie
        pattern: "^[a-zA-Z0-9.-_]+:\\S"
        examples:
          - value: https://genome.jgi.doe.gov/portal/Metanaintenssite/Metanaintenssite.info.html
    any_of:
      - slot_conditions:
          grant_id:
            required: true
      - slot_conditions:
          grant_url:
            required: true
      - slot_conditions:
          funder:
            required: true

  License:
    description: |
      License or rights information for the resource.

      One (or more) of 'id', 'url', or 'name' is required.
    attributes:
      id:
        description: String representing the license, from the [SPDX license identifiers](https://spdx.org/licenses/).
        examples:
          - value: CC-BY-NC-ND-4.0
          - value: Apache-2.0
        exact_mappings:
          - commonmeta:license.id
        close_mappings:
          # where rights_identifier_scheme is 'SPDX'
          - DataCite:attributes.rights_list.rights_identifier
      url:
        description: URL for the license.
        range: uri
        examples:
          - value: https://jgi.doe.gov/user-programs/pmo-overview/policies/
        exact_mappings:
          - commonmeta:license.url
          - DataCite:attributes.rights_list.rights_uri
          - Crossref:message.license.URL
      name:
        description: Full name of the license or a rights statement, if no SPDX identifier is available. Include version information if applicable.
        examples:
          - value: Creative Commons Attribution 4.0 International
          - value: JGI Data Usage Policy
        exact_mappings:
          - DataCite:attributes.rights_list.rights
    any_of:
      - slot_conditions:
          id:
            required: true
      - slot_conditions:
          url:
            required: true
      - slot_conditions:
          name:
            required: true

  Metadata:
    description: Metadata for the credit metadata, including the schema version used, who submitted it, and the date of submission. When the credit metadata for a resource is added or updated, this additional metadata must be provided along with the credit information.
    attributes:
      credit_metadata_schema_version:
        slot_uri: schema:schemaVersion
        description: The version of the credit metadata schema used.
        required: true
        examples:
          - value: 1.1.0
      credit_metadata_source:
        description: Information about where the credit metadata was sourced from.
        multivalued: true
        range: DataSource
      saved_by:
        slot_uri: schema:sdPublisher
        description: PID for the user who added this entry.
        required: true
      timestamp:
        slot_uri: schema:sdDatePublished
        comments:
          - This could be added programmatically when updates occur.
        description: Unix timestamp for the addition of this set of credit metadata.
        required: true
        range: integer

  Organization:
    class_uri: schema:Organization
    description: |
      Represents an organization.

      Recommended resources for organization identifiers include:
        - [Research Organization Registry](http://ror.org)
        - [International Standard Name Identifier](https://isni.org)
        - [Crossref Funder Registry](https://www.crossref.org/services/funder-registry/) (to be subsumed into ROR)

      For example, the US DOE would be entered as:
        organization_name: United States Department of Energy
        organization_id:   ROR:01bj3aw27
    attributes:
      organization_id:
        slot_uri: schema:identifier
        description: Persistent unique identifier for the organization in the format <database name>:<identifier within database>.
        examples:
          - value: ROR:01bj3aw27
          - value: ISNI:0000000123423717
          - value: CrossrefFunder:100000015
        exact_mappings:
          - DataCite:attributes.contributors.affiliation.affiliation_identifier
          - DataCite:attributes.creators.affiliation.affiliation_identifier
        range: uriorcurie
        pattern: "^[a-zA-Z0-9.-_]+:\\S"
      organization_name:
        slot_uri: schema:name
        description: Common name of the organization; use the name recommended by ROR if possible.
        required: true
        exact_mappings:
          - DataCite:attributes.contributors.affiliation.name
          - DataCite:attributes.creators.affiliation.name
          - OSTI.ARTICLE:research_organization
          - JGI:organisms.pi.institution
        examples:
          - value: KBase
          - value: Lawrence Berkeley National Laboratory
          - value: The Ohio State University

  PermanentID:
    description: |
      Represents a persistent unique identifier for an entity and its relationship to some other entity.

      The 'id' field and 'relationship_type' fields are required.

      The values in the 'relationship_type' field come from controlled vocabularies maintained by DataCite and Crossref. See the documentation links below for more details.

      [DataCite relation types](https://support.datacite.org/docs/datacite-metadata-schema-v44-recommended-and-optional-properties#12b-relationtype)

      [Crossref relation types](https://www.crossref.org/documentation/schema-library/markup-guide-metadata-segments/relationships/)
    attributes:
      id:
        slot_uri: schema:identifier
        description: Persistent unique ID for an entity. Should be in the format <database name>:<identifier within database>.
        required: true
        examples:
          - value: DOI:10.46936/10.25585/60000745
          - value: GO:0005456
          - value: HGNC:7470
        exact_mappings:
          - DataCite:attributes.identifier.value
          - DataCite:attributes.alternate_identifiers
            # from: DataCite:attributes.alternate_identifiers[*]
            # via: f"{attributes.alternate_identifiers[*].alternate_identifier_type}:{attributes.alternate_identifiers[*].alternate_identifier}"
          - DataCite:attributes.related_identifiers
            # from: DataCite:attributes.related_identifiers[*]
            # via: f"{attributes.related_identifiers[*].related_identifier_type}:{attributes.related_identifiers[*].related_identifier}"
          - DataCite:attributes.identifiers
            # from: DataCite:attributes.identifiers[*]
            # via: f"{attributes.identifiers[*].identifier_type}:{attributes.identifiers[*].identifier}"
        related_mappings:
          - OSTI.ARTICLE:site_url
        range: uriorcurie
        pattern: "^[a-zA-Z0-9.-_]+:\\S"
      description:
        slot_uri: schema:description
        description: Description of that entity.
        exact_mappings:
          - OSTI.ARTICLE:description
        examples:
          - value: Amaranthus hypochondriacus genome
          - value: "This data analysis workflow demonstrates how to process a metagenome to identify viruses using VirSorter. Then, provides taxonomic classification using vConTACT2."
      relationship_type:
        description: The relationship between the ID and some other entity. For example, when a PermanentID class is used to represent objects in the CreditMetadata field 'related_identifiers', the 'relationship_type' field captures the relationship between the resource being registered and this ID.
        range: RelationshipType
        exact_mappings:
          - DataCite:attributes.related_identifiers.relation_type
          - commonmeta:relations.type
          - OSTI.ARTICLE:related_identifiers.relation
      relationship_type_information:
        description: Free text further describing the relationship, e.g. when the relationship type is 'other'.
        examples:
          - value: Raw reads used to generate the assembly.
        exact_mappings:
          - DataCite:attributes.related_identifiers.relation_type_information

  Title:
    description: |
      Represents the title or name of a resource, the type of that title, and the language used (if appropriate).

      The 'title' field is required; 'title_type' is only necessary if the text is not the primary title.

      If the title_type is 'translated_title', 'language' must be specified.
    attributes:
      language:
        description: The language in which the title is written, using the appropriate IETF BCP-47 notation.
        examples:
          - value: ru-Cyrl
          - value: fr
      title:
        slot_uri: schema:name
        # could also be schema:headline if title type is 'title'
        # subtitle/alternative title: schema:alternativeHeadline
        description: A string used as a title for a resource.
        required: true
        examples:
          - value: Amaranthus hypochondriacus genome
          - value: Геном амаранта ипохондрического
        exact_mappings:
          - DataCite:attributes.titles.title
          - Crossref:message.project.project-title.title
      title_type:
        description: A descriptor for the title for cases where the contents of the 'title' field is not the primary name or title.
        range: TitleType
        examples:
          - value: subtitle
          - value: alternative_title
          - value: translated_title
          - value: other
        exact_mappings:
          - DataCite:attributes.title.titleType

enums:
  ContributorRole:
    enum_uri: roleName
    description: The type of contribution made by a contributor.
    permissible_values:
      contact_person:
        meaning: DataCite:ContactPerson
        title: contact person
        description: Person with knowledge of how to access, troubleshoot, or otherwise field issues related to the resource. May also be "Point of Contact" in organisation that controls access to the resource, if that organisation is different from Publisher, Distributor, Data Manager.
      data_collector:
        meaning: DataCite:DataCollector
        title: data collector
        description: Person/institution responsible for finding, gathering/collecting data under the guidelines of the author(s) or Principal Investigator (PI). May also use when crediting survey conductors, interviewers, event or condition observers, person responsible for monitoring key instrument data.
      data_curator:
        meaning: DataCite:DataCurator
        title: data curator
        description: Person tasked with reviewing, enhancing, cleaning, or standardizing metadata and the associated data submitted for storage, use, and maintenance within a data centre or repository. While the "DataManager" is concerned with digital maintenance, the DataCurator's role encompasses quality assurance focused on content and metadata. This includes checking whether the submitted dataset is complete, with all files and components as described by submitter, whether the metadata is standardized to appropriate systems and schema, whether specialized metadata is needed to add value and ensure access across disciplines, and determining how the metadata might map to search engines, database products, and automated feeds.
      data_manager:
        meaning: DataCite:DataManager
        title: data manager
        description: Person (or organisation with a staff of data managers, such as a data centre) responsible for maintaining the finished resource. The work done by this person or organisation ensures that the resource is periodically "refreshed" in terms of software/hardware support, is kept available or is protected from unauthorized access, is stored in accordance with industry standards, and is handled in accordance with the records management requirements applicable to it.
      distributor:
        meaning: DataCite:Distributor
        title: distributor
        description: Institution tasked with responsibility to generate/disseminate copies of the resource in either electronic or print form. Works stored in more than one archive/repository may credit each as a distributor.
      editor:
        meaning: DataCite:Editor
        title: editor
        description: A person who oversees the details related to the publication format of the resource. N.b. if the Editor is to be credited in place of multiple creators, the Editor's name may be supplied as Creator, with "(Ed.)" appended to the name.
      hosting_institution:
        meaning: DataCite:HostingInstitution
        title: hosting institution
        description: Typically, the organisation allowing the resource to be available on the internet through the provision of its hardware/software/operating support. May also be used for an organisation that stores the data offline. Often a data centre (if that data centre is not the "publisher" of the resource).
      producer:
        meaning: DataCite:Producer
        title: producer
        description: Typically a person or organisation responsible for the artistry and form of a media product. In the data industry, this may be a company "producing" DVDs that package data for future dissemination by a distributor.
      project_leader:
        meaning: DataCite:ProjectLeader
        title: project leader
        description: Person officially designated as head of project team or sub- project team instrumental in the work necessary to development of the resource. The Project Leader is not "removed" from the work that resulted in the resource; he or she remains intimately involved throughout the life of the particular project team.
      project_manager:
        meaning: DataCite:ProjectManager
        title: project manager
        description: Person officially designated as manager of a project. Project may consist of one or many project teams and sub-teams. The manager of a project normally has more administrative responsibility than actual work involvement.
      project_member:
        meaning: DataCite:ProjectMember
        title: project member
        description: Person on the membership list of a designated project/project team. This vocabulary may or may not indicate the quality, quantity, or substance of the person's involvement.
      registration_agency:
        meaning: DataCite:RegistrationAgency
        title: registration agency
        description: Institution/organisation officially appointed by a Registration Authority to handle specific tasks within a defined area of responsibility. DataCite is a Registration Agency for the International DOI Foundation (IDF). One of DataCite's tasks is to assign DOI prefixes to the allocating agents who then assign the full, specific character string to data clients, provide metadata back to the DataCite registry, etc.
      registration_authority:
        meaning: DataCite:RegistrationAuthority
        title: registration authority
        description: A standards-setting body from which Registration Agencies obtain official recognition and guidance. The IDF serves as the Registration Authority for the International Standards Organisation (ISO) in the area/domain of Digital Object Identifiers.
      related_person:
        meaning: DataCite:RelatedPerson
        title: related person
        description: A person without a specifically defined role in the development of the resource, but who is someone the author wishes to recognize. This person could be an author's intellectual mentor, a person providing intellectual leadership in the discipline or subject domain, etc.
      researcher:
        meaning: DataCite:Researcher
        title: researcher
        description: A person involved in analyzing data or the results of an experiment or formal study. May indicate an intern or assistant to one of the authors who helped with research but who was not so "key" as to be listed as an author. Should be a person, not an institution. Note that a person involved in the gathering of data would fall under the contributorType "data_collector." The researcher may find additional data online and correlate it to the data collected for the experiment or study, for example.
      research_group:
        meaning: DataCite:ResearchGroup
        title: research group
        description: Typically refers to a group of individuals with a lab, department, or division; the group has a particular, defined focus of activity. May operate at a narrower level of scope; may or may not hold less administrative responsibility than a project team.
      rights_holder:
        meaning: DataCite:RightsHolder
        title: rights holder
        description: Person or institution owning or managing property rights, including intellectual property rights over the resource.
      sponsor:
        meaning: DataCite:Sponsor
        title: sponsor
        description: Person or organisation that issued a contract or under the auspices of which a work has been written, printed, published, developed, etc. Includes organisations that provide in-kind support, through donation, provision of people or a facility or instrumentation necessary for the development of the resource, etc.
      supervisor:
        meaning: DataCite:Supervisor
        title: supervisor
        description: Designated administrator over one or more groups/teams working to produce a resource or over one or more steps of a development process.
      translator:
        meaning: DataCite:Translator
        title: translator
        description: Person, organisation or automated system responsible for rendering the content of a resource from one language into another.
        exact_mappings:
          - Crossref:translator
          - commonmeta:Translator
          - OSTI.ARTICLE:Translator
      work_package_leader:
        meaning: DataCite:WorkPackageLeader
        title: work package leader
        description: A Work Package is a recognized data product, not all of which is included in publication. The package, instead, may include notes, discarded documents, etc. The Work Package Leader is responsible for ensuring the comprehensive contents, versioning, and availability of the Work Package during the development of the resource.
      other:
        meaning: DataCite:Other
        title: other
        description: Any person or institution making a significant contribution to the development and/or maintenance of the resource, but whose contribution does not "fit" other controlled vocabulary for contributorType. Could be a photographer, artist, or writer whose contribution helped to publicize the resource (as opposed to creating it), a reviewer of the resource, someone providing administrative services to the author (such as depositing updates into an online repository, analysing usage, etc.), or one of many other roles.
      author:
        meaning: Crossref:author
        title: author
        description: A creator of the resource. Equivalent to a DataCite creator.
        exact_mappings:
          - commonmeta:Author
          - OSTI.ARTICLE:AUTHOR
      chair:
        meaning: Crossref:chair
        title: chair
        description: Person who chairs a conference, committee, or other body responsible for the resource.
        exact_mappings:
          - commonmeta:Chair
          - OSTI.ARTICLE:Chair
      corresponding_author:
        meaning: Crossref:corresponding-author
        title: corresponding author
        description: The author responsible for correspondence about the resource.
      maintainer:
        meaning: commonmeta:Maintainer
        title: maintainer
        description: Person or organisation responsible for the ongoing maintenance of the resource, e.g. a software package or a database.
      reader:
        meaning: Crossref:reader
        title: reader
        description: Person who reads the resource aloud, e.g. for an audio recording.
        exact_mappings:
          - commonmeta:Reader
      reviewer:
        meaning: Crossref:reviewer
        title: reviewer
        description: Person who reviews the resource, e.g. a peer reviewer.
        exact_mappings:
          - commonmeta:Reviewer
          - OSTI.ARTICLE:Reviewer
      review_assistant:
        meaning: Crossref:review-assistant
        title: review assistant
        description: Person who assists a reviewer.
        exact_mappings:
          - commonmeta:ReviewAssistant
          - OSTI.ARTICLE:ReviewAssistant
      reviewer_external:
        meaning: Crossref:reviewer-external
        title: external reviewer
        description: Reviewer from outside the organisation or editorial board responsible for the review process.
        exact_mappings:
          - commonmeta:ReviewerExternal
          - OSTI.ARTICLE:ReviewerExternal
      stats_reviewer:
        meaning: Crossref:stats-reviewer
        title: statistical reviewer
        description: Reviewer who assesses the statistical methods and analysis used in the resource.
        exact_mappings:
          - commonmeta:StatsReviewer
          - OSTI.ARTICLE:StatsReviewer
      conceptualization:
        meaning: crcr:conceptualization
        title: conceptualization
        description: Ideas; formulation or evolution of overarching research goals and aims.
      data_curation:
        meaning: crcr:data-curation
        title: data curation
        description: Management activities to annotate (produce metadata), scrub data and maintain research data (including software code, where it is necessary for interpreting the data itself) for initial use and later re-use.
      formal_analysis:
        meaning: crcr:formal-analysis
        title: formal analysis
        description: Application of statistical, mathematical, computational, or other formal techniques to analyze or synthesize study data.
      funding_acquisition:
        meaning: crcr:funding-acquisition
        title: funding acquisition
        description: Acquisition of the financial support for the project leading to this publication.
      investigation:
        meaning: crcr:investigation
        title: investigation
        description: Conducting a research and investigation process, specifically performing the experiments, or data/evidence collection.
      methodology:
        meaning: crcr:methodology
        title: methodology
        description: Development or design of methodology; creation of models.
      project_administration:
        meaning: crcr:project-administration
        title: project administration
        description: Management and coordination responsibility for the research activity planning and execution.
      resources:
        meaning: crcr:resources
        title: resources
        description: Provision of study materials, reagents, materials, patients, laboratory samples, animals, instrumentation, computing resources, or other analysis tools.
      software:
        meaning: crcr:software
        title: software
        description: Programming, software development; designing computer programs; implementation of the computer code and supporting algorithms; testing of existing code components.
      supervision:
        meaning: crcr:supervision
        title: supervision
        description: Oversight and leadership responsibility for the research activity planning and execution, including mentorship external to the core team.
      validation:
        meaning: crcr:validation
        title: validation
        description: Verification, whether as a part of the activity or separate, of the overall replication/reproducibility of results/experiments and other research outputs.
      visualization:
        meaning: crcr:visualization
        title: visualization
        description: Preparation, creation and/or presentation of the published work, specifically visualization/data presentation.
      writing_original_draft:
        meaning: crcr:writing-original-draft
        title: writing, original draft
        description: Preparation, creation and/or presentation of the published work, specifically writing the initial draft (including substantive translation).
      writing_review_editing:
        meaning: crcr:writing-review-editing
        title: writing, review and/or editing
        description: Preparation, creation and/or presentation of the published work by those from the original research group, specifically critical review, commentary or revision -- including pre- or post-publication stages.
    reachable_from:
      source_ontology: bioportal:DATACITE-VOCAB
      source_nodes:
        - DataCite:ContributorRole
      include_self: false
      relationship_types:
        - rdfs:subClassOf

  ContributorType:
    description: The type of contributor being represented.
    permissible_values:
      Person:
        description: A person.
        meaning: schema:Person
      Organization:
        description: An organization.
        meaning: schema:Organization
    reachable_from:
      source_ontology: bioportal:DATACITE-VOCAB
      source_nodes:
        - DataCite:ResourceCreatorType
      include_self: false
      relationship_types:
        - rdfs:subClassOf

  DescriptionType:
    description: The type of text being represented.
    permissible_values:
      abstract:
        meaning: DataCite:abstract
        description: A brief description of the resource and the context in which the resource was created.
      description:
        meaning: DataCite:descriptions.description.descriptionType
      summary:
        meaning: DataCite:summary
        exact_mappings:
          - commonmeta:Summary
      methods:
        meaning: DataCite:Methods
        description: The methodology employed for the study or research.
        exact_mappings:
          - commonmeta:Methods
      series_information:
        meaning: DataCite:SeriesInformation
        description: Information about a repeating series, such as volume, issue, or number.
      table_of_contents:
        meaning: DataCite:TableOfContents
        description: A listing of the table of contents.
      technical_info:
        meaning: DataCite:TechnicalInfo
        description: Detailed information that may be associated with design, implementation, operation, use, and/or maintenance of a process, system, or instrument. For software, this may include the contents of a README file.
        exact_mappings:
          - commonmeta:TechnicalInfo
        close_mappings:
          - OSTI.ARTICLE:format_information
      acknowledgement:
        meaning: Crossref:acknowledgement
        description: Acknowledgement of contributions to the resource that are not otherwise credited.
      accessibility_statement:
        meaning: Crossref:accessibility
        description: Statement about the accessibility of the resource.
      ai_use_statement:
        meaning: Crossref:ai_use
        description: Statement about the use of artificial intelligence tools in the creation of the resource.
      conflict_of_interest_statement:
        meaning: Crossref:conflict_of_interest
        description: Statement disclosing any competing interests of the creators.
      copyright_statement:
        meaning: Crossref:copyright
        description: Statement of copyright for the resource.
      data_availability_statement:
        meaning: Crossref:data_availability
        description: Statement about where the data underlying the resource can be accessed, and any conditions of access.
      ethics_statement:
        meaning: Crossref:ethics
        description: Statement about ethical approval or ethical considerations for the work.
      funding_statement:
        meaning: Crossref:funding
        description: Free text statement of the funding received for the work. Use 'funding' for structured funding information.
      versioning_statement:
        meaning: Crossref:versioning
        description: Statement describing the version of the resource and how it differs from other versions.
      other:
        meaning: DataCite:Other
        description: Other description information that does not fit into an existing category.
        exact_mappings:
          - commonmeta:Other
          - Crossref:other

  EventType:
    description: The type of date being represented.
    permissible_values:
      accepted:
        meaning: DataCite:accepted
        description: |
          The date that the publisher accepted the resource into their system. To indicate the start of an embargo period, use Submitted or Accepted, as appropriate.
        exact_mappings:
          - commonmeta:date.accepted
          - Crossref:acceptance_date
      accessed:
        meaning: commonmeta:date.accessed
        description: |
          The date the resource was accessed, e.g. when the resource content was retrieved for use in another resource.
      approved:
        meaning: Crossref:approval_date
        description: |
          The date on which a dissertation was accepted by the institution awarding the degree, a report was approved, or a standard was accepted.
        close_mappings:
          - Crossref:posted_date
      available:
        # schema:datePublished
        meaning: DataCite:available
        description: |
          The date the resource is made publicly available. To indicate the end of an embargo period, use Available.
      copyrighted:
        meaning: DataCite:copyrighted
        description: |
          The specific, documented date at which the resource receives a copyrighted status, if applicable.
      collected:
        meaning: DataCite:collected
        description: |
          The date or date range in which the resource content was collected. To indicate precise or particular timeframes in which research was conducted.
      coverage:
        meaning: DataCite:Coverage
        description: |
          The date or date range that the content of the resource is about, e.g. the time period covered by a set of observations or a report.
        close_mappings:
          # via { date: f"{src.report_period_start_date}/{src.report_period_end_date}", event: 'coverage' }
          - OSTI.ARTICLE:report_period_start_date
          - OSTI.ARTICLE:report_period_end_date
      created:
        meaning: DataCite:created
        description: |
          The date the resource itself was put together; this could refer to a timeframe in ancient history, be a date range or a single date for a final component, e.g., the finalized file with all of the data.
        exact_mappings:
          - commonmeta:date.created
          - Crossref:creation_date
      issued:
        meaning: DataCite:issued
        description: |
          The date that the resource is published or distributed e.g. to a data centre
        close_mappings:
          - commonmeta:date.published
          - Crossref:publication_date
      submitted:
        meaning: DataCite:submitted
        description: |
          The date the creator submits the resource to the publisher. This could be different from Accepted if the publisher then applies a selection process. To indicate the start of an embargo period, use Submitted or Accepted, as appropriate.
      updated:
        meaning: DataCite:updated
        description: |
          The date of the last update to the resource, when the resource is being added to.
      valid:
        meaning: DataCite:valid
        description: |
          The date (or date range) during which the dataset or resource is accurate.
      withdrawn:
        meaning: DataCite:withdrawn
        description: |
          The date the resource is removed.
      other:
        meaning: DataCite:other
    reachable_from:
      source_ontology: bioportal:DATACITE-VOCAB
      source_nodes:
        - DataCite:DateType
      include_self: false
      relationship_types:
        - rdfs:subClassOf

  RelationshipType:
    description: The relationship between two entities. For example, when a PermanentID class is used to represent objects in the CreditMetadata field 'related_identifiers', the 'relationship_type' field captures the relationship between the resource being registered (A) and this ID (B).
    permissible_values:
      based_on_data:
        title: based on data
        meaning: Crossref:BasedOnData
      cites:
        meaning: DataCite:Cites
        description: Indicates that A includes B in a citation.
      collects:
        meaning: DataCite:Collects
        description: Indicates that A is used to collect B, e.g. an instrument (A) used to collect a dataset (B).
      compiles:
        meaning: DataCite:Compiles
        description: Indicates B is the result of a compile or creation event using A. May be used for software and text, as a compiler can be a computer program or a person.
      continues:
        meaning: DataCite:Continues
        description: Indicates A is a continuation of the work B.
      describes:
        meaning: DataCite:Describes
        description: Indicates A describes B.
      documents:
        meaning: DataCite:Documents
        description: Indicates A is documentation about B; e.g. points to software documentation.
      finances:
        meaning: Crossref:Finances
      has_comment:
        title: has comment
        meaning: Crossref:HasComment
      has_derivation:
        title: has derivation
        meaning: Crossref:HasDerivation
      has_expression:
        title: has expression
        meaning: Crossref:HasExpression
      has_format:
        title: has format
        meaning: Crossref:HasFormat
      has_manifestation:
        title: has manifestation
        meaning: Crossref:HasManifestation
      has_manuscript:
        title: has manuscript
        meaning: Crossref:HasManuscript
      has_metadata:
        title: has metadata
        meaning: DataCite:HasMetadata
        description: Indicates resource A has additional metadata B.
      has_part:
        title: has part
        meaning: DataCite:HasPart
        description: Indicates A includes the part B. Primarily this relation is applied to container-contained type relationships. May be used for individual software modules; note that code repository-to-version relationships should be modeled using IsVersionOf and HasVersion.
      has_preprint:
        title: has preprint
        meaning: Crossref:HasPreprint
      has_related_material:
        title: has related material
        meaning: Crossref:HasRelatedMaterial
      has_reply:
        title: has reply
        meaning: Crossref:HasReply
      has_review:
        title: has review
        meaning: Crossref:HasReview
      has_translation:
        title: has translation
        meaning: Crossref:HasTranslation
        description: Indicates B is a translation of A.
        exact_mappings:
          - DataCite:HasTranslation
      has_version:
        title: has version
        meaning: DataCite:HasVersion
        description: Indicates A has a version (B). The registered resource such as a software package or code repository has a versioned instance (indicates A has the instance B) e.g. it may be used to relate an un-versioned code repository to one of its specific software versions.
      is_based_on:
        title: is based on
        meaning: Crossref:IsBasedOn
      is_basis_for:
        title: is basis for
        meaning: Crossref:IsBasisFor
      is_cited_by:
        title: is cited by
        meaning: DataCite:IsCitedBy
        description: Indicates that B includes A in a citation.
      is_collected_by:
        title: is collected by
        meaning: DataCite:IsCollectedBy
        description: Indicates that A is collected by B, e.g. a dataset (A) collected using an instrument (B).
      is_comment_on:
        title: is comment on
        meaning: Crossref:IsCommentOn
      is_compiled_by:
        title: is compiled by
        meaning: DataCite:IsCompiledBy
        description: Indicates B is used to compile or create A. May be used for software and text, as a compiler can be a computer program or a person.
      is_continued_by:
        title: is continued by
        meaning: DataCite:IsContinuedBy
        description: Indicates A is continued by the work B.
      is_data_basis_for:
        title: is data basis for
        meaning: Crossref:IsDataBasisFor
      is_derived_from:
        title: is derived from
        meaning: DataCite:IsDerivedFrom
        description: Indicates B is a source upon which A is based. IsDerivedFrom should be used for a resource that is a derivative of an original resource. For example, 'A isDerivedFrom B' could describe a dataset (A) derived from a larger dataset (B) where data values have been manipulated from their original state.
      is_described_by:
        title: is described by
        meaning: DataCite:IsDescribedBy
        description: Indicates A is described by B.
      is_documented_by:
        title: is documented by
        meaning: DataCite:IsDocumentedBy
        description: Indicates B is documentation about/explaining A; e.g. points to software documentation.
      is_expression_of:
        title: is expression of
        meaning: Crossref:IsExpressionOf
      is_financed_by:
        title: is financed by
        meaning: Crossref:IsFinancedBy
      is_format_of:
        title: is format of
        meaning: Crossref:IsFormatOf
      is_identical_to:
        title: is identical to
        meaning: DataCite:IsIdenticalTo
        description: Indicates that A is identical to B, for use when there is a need to register two separate instances of the same resource. Should be used for a resource that is the same as the registered resource but is saved in another location, e.g. another institution.
      is_manifestation_of:
        title: is manifestation of
        meaning: Crossref:IsManifestationOf
      is_manuscript_of:
        title: is manuscript of
        meaning: Crossref:IsManuscriptOf
      is_metadata_for:
        title: is metadata for
        meaning: DataCite:IsMetadataFor
        description: Indicates additional metadata A for a resource B.
      is_new_version_of:
        title: is new version of
        meaning: DataCite:IsNewVersionOf
        description: Indicates A is a new edition of B, where the new edition has been modified or updated.
      is_obsoleted_by:
        title: is obsoleted by
        meaning: DataCite:IsObsoletedBy
        description: Indicates A is replaced by B.
      is_original_form_of:
        title: is original form of
        meaning: DataCite:IsOriginalFormOf
        description: Indicates A is the original form of B. May be used for different software operating systems or compiler formats, for example.
      is_part_of:
        title: is part of
        meaning: DataCite:IsPartOf
        description: Indicates A is a portion of B; may be used for elements of a series. Primarily this relation is applied to container-contained type relationships. May be used for individual software modules; note that code repository-to-version relationships should be modeled using IsVersionOf and HasVersion.
      is_preprint_of:
        title: is preprint of
        meaning: Crossref:IsPreprintOf
      is_previous_version_of:
        title: is previous version of
        meaning: DataCite:IsPreviousVersionOf
        description: Indicates A is a previous edition of B.
      is_published_in:
        title: is published in
        meaning: DataCite:IsPublishedIn
        description: Indicates A is published inside B, but is independent of other things published inside of B.
      is_referenced_by:
        title: is referenced by
        meaning: DataCite:IsReferencedBy
        description: Indicates A is used as a source of information by B.
      is_related_material:
        title: is related material
        meaning: Crossref:IsRelatedMaterial
      is_replaced_by:
        title: is replaced by
        meaning: Crossref:IsReplacedBy
      is_reply_to:
        title: is reply to
        meaning: Crossref:IsReplyTo
      is_required_by:
        title: is required by
        meaning: DataCite:IsRequiredBy
        description: Indicates A is required by B. May be used to indicate software dependencies.
      is_review_of:
        title: is review of
        meaning: Crossref:IsReviewOf
      is_reviewed_by:
        title: is reviewed by
        meaning: DataCite:IsReviewedBy
        description: Indicates that A is reviewed by B.
      is_same_as:
        title: is same as
        meaning: Crossref:IsSameAs
      is_source_of:
        title: is source of
        meaning: DataCite:IsSourceOf
        description: Indicates A is a source upon which B is based. IsSourceOf is the original resource from which a derivative resource was created. For example, 'A isSourceOf B' could describe a dataset (A) which acts as the source of a derived dataset (B) where the values have been manipulated.
      is_supplement_to:
        title: is supplement to
        meaning: DataCite:IsSupplementTo
        description: Indicates that A is a supplement to B.
      is_supplemented_by:
        title: is supplemented by
        meaning: DataCite:IsSupplementedBy
        description: Indicates that B is a supplement to A.
      is_translation_of:
        title: is translation of
        meaning: Crossref:IsTranslationOf
        description: Indicates A is a translation of B.
        exact_mappings:
          - DataCite:IsTranslationOf
      is_variant_form_of:
        title: is variant form of
        meaning: DataCite:IsVariantFormOf
        description: Indicates A is a variant or different form of B. Use for a different form of one thing. May be used for different software operating systems or compiler formats, for example.
      is_version_of:
        title: is version of
        meaning: DataCite:IsVersionOf
        description: Indicates A is a version of B. The registered resource is an instance of a target resource (indicates that A is an instance of B) e.g. it may be used to relate a specific version of a software package to its software code repository.
      obsoletes:
        meaning: DataCite:Obsoletes
        description: Indicates A replaces B.
      other:
        meaning: DataCite:Other
        description: Indicates A is related to B in a way not covered by the other relationship types. Describe the relationship in the 'relationship_type_information' field.
      references:
        meaning: DataCite:References
        description: Indicates B is used as a source of information for A.
      replaces:
        meaning: Crossref:Replaces
      requires:
        meaning: DataCite:Requires
        description: Indicates A requires B. May be used to indicate software dependencies.
      reviews:
        meaning: DataCite:Reviews
        description: Indicates that A is a review of B.
      unknown:
        title: unknown
        description: The relationship between subject and object is unknown.
    reachable_from:
      source_ontology: bioportal:DATACITE-VOCAB
      source_nodes:
        - DataCite:RelationType
      include_self: false
      relationship_types:
        - rdfs:subClassOf

  ResourceType:
    description: |
      The type of resource being represented.

      Values combine the [DataCite resourceTypeGeneral](https://datacite-metadata-schema.readthedocs.io/en/4.7/appendices/appendix-1/resourceTypeGeneral/) vocabulary (v4.7) with the resource types used by [Commonmeta](https://docs.commonmeta.org), Crossref, and OSTI. Where a resource type exists in DataCite, the DataCite term is used.
    permissible_values:
      article:
        meaning: commonmeta:Article
        description: An article not published in a journal or proceedings, e.g. a magazine or newspaper article.
      audiovisual:
        meaning: DataCite:Audiovisual
        description: A series of visual representations imparting an impression of motion when shown in succession. May or may not include sound.
        exact_mappings:
          - commonmeta:Audiovisual
      award:
        meaning: DataCite:Award
        description: Funding or support provided to an individual or organization to conduct research or academic work, e.g. a grant.
        exact_mappings:
          - commonmeta:Grant
          - Crossref:grant
      blog:
        meaning: Crossref:blog
        description: A blog; a collection of blog posts.
      blog_post:
        meaning: commonmeta:BlogPost
        description: A single post in a blog.
        exact_mappings:
          - Crossref:blog_post
      book:
        meaning: DataCite:Book
        description: A medium for recording information in the form of writing or images, typically composed of many pages bound together and protected by a cover.
        exact_mappings:
          - commonmeta:Book
          - Crossref:book
          - OSTI.ARTICLE:B
      book_chapter:
        meaning: DataCite:BookChapter
        description: One of the main divisions of a book.
        exact_mappings:
          - commonmeta:BookChapter
          - Crossref:book_chapter
      book_part:
        meaning: commonmeta:BookPart
        description: A part of a book that is larger than a chapter.
      book_section:
        meaning: commonmeta:BookSection
        description: A section of a book that is smaller than a chapter.
      book_series:
        meaning: commonmeta:BookSeries
        description: A series of books.
      book_set:
        meaning: commonmeta:BookSet
        description: A set of books published together, e.g. a multi-volume work.
      collection:
        meaning: DataCite:Collection
        description: An aggregation of resources, which may encompass collections of one resource type as well as those of mixed types.
        exact_mappings:
          - commonmeta:Collection
          - Crossref:collection
      component:
        meaning: commonmeta:Component
        description: A component of another resource, e.g. a figure, table, or supplementary file.
        close_mappings:
          - Crossref:sa_component
      computational_notebook:
        meaning: DataCite:ComputationalNotebook
        description: A virtual notebook environment used for literate programming.
      conference_paper:
        meaning: DataCite:ConferencePaper
        description: Article that is written with the goal of being accepted to a conference.
        exact_mappings:
          - commonmeta:ProceedingsArticle
          - Crossref:conference_paper
        close_mappings:
          - OSTI.ARTICLE:CO
      conference_proceeding:
        meaning: DataCite:ConferenceProceeding
        description: Collection of academic papers published in the context of an academic conference.
        exact_mappings:
          - commonmeta:Proceedings
          - Crossref:conference_proceedings
      data_paper:
        meaning: DataCite:DataPaper
        description: A factual and objective publication with a focused intent to identify and describe specific data, sets of data, or data collections to facilitate discoverability.
      database:
        meaning: commonmeta:Database
        description: A database, i.e. an organized collection of datasets or records.
        exact_mappings:
          - Crossref:database
      dataset:
        description: Data encoded in a defined structure.
        meaning: schema:Dataset
        exact_mappings:
          - DataCite:Dataset
          - commonmeta:Dataset
          - Crossref:dataset
          - OSTI.ARTICLE:DA
      dissertation:
        meaning: DataCite:Dissertation
        description: A written essay, treatise, or thesis, especially one written by a candidate for the degree of Doctor of Philosophy.
        exact_mappings:
          - commonmeta:Dissertation
          - Crossref:dissertation
          - OSTI.ARTICLE:TD
      document:
        meaning: commonmeta:Document
        description: A document that does not fit into the other text-based categories.
        close_mappings:
          # factsheet, program document, software manual
          - OSTI.ARTICLE:FS
          - OSTI.ARTICLE:PD
          - OSTI.ARTICLE:SM
      entry:
        meaning: commonmeta:Entry
        description: An entry in a reference work, e.g. an encyclopedia or dictionary.
        close_mappings:
          - Crossref:reference_entry
      event:
        meaning: DataCite:Event
        description: A non-persistent, time-based occurrence.
        exact_mappings:
          - commonmeta:Event
      image:
        meaning: DataCite:Image
        description: A visual representation other than text.
        exact_mappings:
          - commonmeta:Image
      instrument:
        meaning: DataCite:Instrument
        description: A device, tool or apparatus used to obtain, measure and/or analyze data.
        exact_mappings:
          - commonmeta:Instrument
      interactive_resource:
        meaning: DataCite:InteractiveResource
        description: A resource requiring interaction from the user to be understood, executed, or experienced.
        exact_mappings:
          - commonmeta:InteractiveResource
      journal:
        meaning: DataCite:Journal
        description: A scholarly publication consisting of articles that is published regularly throughout the year.
        exact_mappings:
          - commonmeta:Journal
          - Crossref:journal
      journal_article:
        meaning: DataCite:JournalArticle
        description: A written composition on a topic of interest, which forms a separate part of a journal.
        exact_mappings:
          - commonmeta:JournalArticle
          - Crossref:journal_article
          - OSTI.ARTICLE:JA
      journal_issue:
        meaning: commonmeta:JournalIssue
        description: An issue of a journal.
        exact_mappings:
          - Crossref:journal_issue
      journal_volume:
        meaning: commonmeta:JournalVolume
        description: A volume of a journal.
        exact_mappings:
          - Crossref:journal_volume
      letter:
        meaning: Crossref:letter
        description: A short communication, e.g. a letter to the editor.
      model:
        meaning: DataCite:Model
        description: An abstract, conceptual, graphical, mathematical or visualization model that represents empirical objects, phenomena, or physical processes.
      output_management_plan:
        meaning: DataCite:OutputManagementPlan
        description: A formal document that outlines how research outputs are to be handled both during a research project and after the project is completed, e.g. a data management plan.
      patent:
        meaning: Crossref:patent
        description: A patent or patent application.
        close_mappings:
          - OSTI.ARTICLE:P
          - OSTI.ARTICLE:PA
      peer_review:
        meaning: DataCite:PeerReview
        description: Evaluation of scientific, academic, or professional work by others working in the same field.
        exact_mappings:
          - commonmeta:PeerReview
          - Crossref:peer_review
      physical_object:
        meaning: DataCite:PhysicalObject
        description: An inanimate, three-dimensional object or substance, e.g. a physical sample.
        exact_mappings:
          - commonmeta:PhysicalObject
      poster:
        meaning: DataCite:Poster
        description: A visual presentation of research, typically displayed at a conference.
        exact_mappings:
          - Crossref:poster
      preprint:
        meaning: DataCite:Preprint
        description: A version of a scholarly or scientific paper that precedes formal peer review and publication in a peer-reviewed scholarly or scientific journal.
        exact_mappings:
          - Crossref:preprint
      presentation:
        meaning: DataCite:Presentation
        description: A set of slides or other material used to deliver a talk.
        exact_mappings:
          - commonmeta:Presentation
      proceedings_series:
        meaning: commonmeta:ProceedingsSeries
        description: A series of conference proceedings.
      project:
        meaning: DataCite:Project
        description: A planned endeavor or activity, frequently collaborative, intended to achieve a particular aim using allocated resources such as budget, time, and expertise.
      protocol:
        meaning: Crossref:protocol
        description: A detailed description of the procedures used in an experiment or study.
      registered_report:
        meaning: Crossref:registered_report
        description: A study design and analysis plan that is peer reviewed before the research is conducted.
      report:
        meaning: DataCite:Report
        description: A document that presents information in an organized format for a specific audience and purpose, e.g. a technical report.
        exact_mappings:
          - commonmeta:Report
          - Crossref:report
          - OSTI.ARTICLE:TR
        close_mappings:
          # accomplishment report
          - OSTI.ARTICLE:AR
      report_component:
        meaning: commonmeta:ReportComponent
        description: A component of a report, e.g. a chapter.
      report_series:
        meaning: commonmeta:ReportSeries
        description: A series of reports.
      service:
        meaning: DataCite:Service
        description: An organized system of apparatus, appliances, staff, etc., for supplying some function(s) required by end users.
      software:
        meaning: DataCite:Software
        description: A computer program other than a computational notebook, in either source code (text) or compiled form.
        exact_mappings:
          - commonmeta:Software
          - Crossref:software
      sound:
        meaning: DataCite:Sound
        description: A resource primarily intended to be heard.
      standard:
        meaning: DataCite:Standard
        description: Something established by authority, custom, or general consent as a model, example, or point of reference.
        exact_mappings:
          - commonmeta:Standard
          - Crossref:standard
      study_registration:
        meaning: DataCite:StudyRegistration
        description: A detailed, time-stamped description of a research plan, often openly shared in a registry or published in a journal before the study is conducted.
        exact_mappings:
          - commonmeta:StudyRegistration
      text:
        meaning: DataCite:Text
        description: A resource consisting primarily of words for reading that is not covered by any other textual resource type.
      web_page:
        meaning: commonmeta:WebPage
        description: A web page or web site.
        exact_mappings:
          - Crossref:web_resource
      workflow:
        meaning: DataCite:Workflow
        description: A structured series of steps which can be executed to produce a final outcome, allowing users a means to specify and enact their work in a more reproducible manner.
      other:
        meaning: DataCite:Other
        description: A resource that does not fit into any of the other categories. Describe the resource type in the 'resource_type_detail' field.
        exact_mappings:
          - commonmeta:Other
          - Crossref:other
          - OSTI.ARTICLE:OT
        close_mappings:
          # miscellaneous
          - OSTI.ARTICLE:MI

  TitleType:
    description: The type of title being represented.
    permissible_values:
      subtitle:
        description: Any subtitle for the resource.
      alternative_title:
        description: Other title(s) or names for the resource.
      translated_title:
        description: Translation of the title into another language.
      other:
        description: Anything that doesn't fit into the above categories.
