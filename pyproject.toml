[tool.poetry]
name = "credit_engine"
version = "0.1.0"
description = "Credit Metadata for Data Citation"
authors = ["ialarmedalien <ialarmedalien@gmail.com>"]
license = "MIT"
readme = "README.md"
include = ["README.md", "schema/kbase"]

packages = [
    { include = 'credit_engine' }
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
pytest = "^8.3.2"
pytest-cases = "^3.8.5"
pytest-cov = "^6.0.0"
pytest-sugar = "^1.0.0"

[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.5.31"
mkdocs-mermaid2-plugin = "^1.1.1"

[tool.poetry.group.schema2model.dependencies]
json2python-models = { version = "^0.3.0", optional = true }
xmlschema = { version = "^2.3.1", optional = true }
xsdata = { extras = ["cli", "lxml", "soap"], version = "^23.6", optional = true }

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry.dependencies]
jsonschema = "^4.23.0"
python = "^3.12"
requests = "^2.32.3"
linkml = { version = "^1.8.2", optional = true }
pydantic = { extras = ["email"], version = "^2.8.2" }

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.extras]
docs = ["linkml", "mkdocs-material", "mkdocs-mermaid2-plugin"]

[tool.ruff]
line-length = 100

extend-exclude = [
    "lib/installed_clients/*"
]

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
select = [
    # core
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "C90", # mccabe +
    "I", # isort
    "N", # pep8-naming
    "D", # pydocstyle
    "UP", # pyupgrade
    # extensions
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B", # flake8-bugbear
    "A", # flake8-builtins
    # "COM", # flake8-commas
    "CPY", # flake8-copyright
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    # "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    "FIX", # flake8-fixme
    "ERA", # eradicate
    # "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "TRY", # tryceratops
    "FLY", # flynt
    # "NPY", # NumPy-specific rules
    "AIR", # Airflow
    "PERF", # Perflint
    "FURB", # refurb
    "LOG", # flake8-logging
    "RUF", # Ruff-specific rules
]

# E203: whitespace before ',', ';', or ':'
# E501: line length
# ISC001: conflicts with Ruff's formatter
# W503: line break after binary operator
ignore = [
    "E203",
    "E501",
    "ISC001",
    "S101",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    "__pypackages__",
    "_build",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git-rewrite",
    ".git",
    ".github",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "*.pyc",
    "buck-out",
    "build",
    "deps",
    "dist",
    "node_modules",
    "other_schema",
    "python-coverage",
    "sample_data",
    "venv",
]
per-file-ignores = {}
